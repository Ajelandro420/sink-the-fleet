<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hundir la Flota</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="inicio">
<div class="contenedor-principal">
    <!-- Ranking -->
    <div class="bloc bloc-ranking" id="blocRanking" style="display:none;">
        <h2> Top 10</h2>
        <ul id="ranking" class="ranking-list">
            <li>Cargando...</li>
        </ul>
    </div>

    <!-- Configuración -->
    <div class="bloc bloc-1" id="bloc1">
        <h2>Configuració</h2>
        <form id="formConfig">
            <div class="form-group">
                <label for="files">Filas (7-20):</label>
                <input type="number" id="files" min="7" max="20" value="10" required>
            </div>
            <div class="form-group">
                <label for="columnes">Columnas (7-20):</label>
                <input type="number" id="columnes" min="7" max="20" value="10" required>
            </div>
            <div class="form-group">
                <label for="jugador">Nombre (opcional):</label>
                <input type="text" id="jugador" placeholder="Anonimo">
            </div>
            <div>
                <input type="radio" id="facil" name="dificultat" value="1" />
                <label for="facil">Fàcil</label>
                <input type="radio" id="mitja" name="dificultat" value="2" />
                <label for="mitja">Mitjana</label>
                <input type="radio" id="dificil" name="dificultat" value="3" />
                <label for="dificil">Difícil</label>
            </div>
            <button type="button" id="btnComencar" class="btn-primary">Començar Partida</button>
        </form>
        <div class="banner">
            <p>¡Elimina la flota enemiga!</p>
        </div>
    </div>

    <!-- Tablero -->
    <div class="bloc bloc-2" id="bloc2" style="display:none;">
        <div id="tablero" class="tablero"></div>
    </div>

    <!-- Estadísticas -->
    <div class="bloc bloc-3" id="bloc3" style="display:none;">
        <h2>📊 Estadístiques</h2>
        <div class="stat"><span class="stat-label">Dispars:</span><span class="stat-value" id="dispars">0</span></div>
        <div class="stat"><span class="stat-label">Encerts:</span><span class="stat-value" id="encerts">0</span></div>
        <div class="stat"><span class="stat-label">Vaixells enfonsats:</span><span class="stat-value" id="enfonsats">0</span></div>
        <div class="stat"><span class="stat-label">Puntuació:</span><span class="stat-value" id="puntuacio">0</span></div>
        <button class="btn-secondary" id="btnAbandonar">Abandonar</button>
    </div>
</div>
<div id="mensajeVictoria" style="display:none;"></div>
<script src="app.js"></script>
<audio id="hit" src="assets/hit.mp3" preload="auto"></audio>
<audio id="sunken" src="assets/sunken.mp3" preload="auto"></audio>
<audio id="miss" src="assets/miss.mp3" preload="auto"></audio>
<audio id="win" src="assets/win.mp3" preload="auto"></audio>
<audio id="lose" src="assets/lose.mp3" preload="auto"></audio>
</body>
</html>
